name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (compile check)
        run: python -m compileall -q activeforge tests

      - name: Run tests
        run: python -m pytest -q -W ignore::UserWarning

      - name: Demo smoke (end-to-end benchmark)
        run: python -m activeforge.cli bench --out benchmark.json

      - name: Verify benchmark.json produced
        run: python -c "import json;d=json.load(open('benchmark.json'));assert d['quality_grade'] in ('S','A','B');print('grade:',d['quality_grade'])"
